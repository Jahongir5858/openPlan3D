name: Deploy OpenPlan3D to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @sveltejs/adapter-static wrangler

      - name: Configure static Svelte build
        run: |
          cat > svelte.config.js <<'EOF'
          import adapter from '@sveltejs/adapter-static';

          /** @type {import('@sveltejs/kit').Config} */
          const config = {
            kit: {
              adapter: adapter({ fallback: 'index.html' })
            }
          };

          export default config;
          EOF

      - name: Build web app
        run: npm run build

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='openplan3d-db');if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create openplan3d-db
            DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='openplan3d-db');if(x)process.stdout.write(x.uuid||x.id||'')})")
          fi
          if [ -z "$DB_ID" ]; then
            echo "D1 database id could not be resolved" >&2
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare Wrangler config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.jsonc', 'utf8');
          text = text.replace('REPLACED_BY_DEPLOY_WORKFLOW', process.env.D1_DATABASE_ID);
          fs.writeFileSync('wrangler.deploy.jsonc', text);
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply openplan3d-db --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc
