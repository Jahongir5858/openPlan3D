name: Validate final fixed release

on:
  push:
    branches:
      - final-fixed-release

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type and Svelte check
        run: npm run check
      - name: Production build
        run: npm run build
