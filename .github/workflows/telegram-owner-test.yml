name: Build Telegram Owner Presence Test

on:
  workflow_dispatch:
  push:
    branches:
      - telegram-owner-presence-test-20260925
    paths:
      - 'telegram-owner-test/**'
      - '.github/workflows/telegram-owner-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: telegram-owner-presence-test-20260925
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Clone Telegram Web K
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/TelegramOrg/Telegram-web-k.git tweb

      - name: Install dependencies
        working-directory: tweb
        run: pnpm install --frozen-lockfile

      - name: Inject Owner Presence
        run: |
          cp telegram-owner-test/owner-presence.js tweb/public/owner-presence.js
          node telegram-owner-test/inject.mjs tweb/index.html

      - name: Build Telegram Web K
        working-directory: tweb
        run: pnpm exec vite build --base=./

      - name: Publish build into branch folder
        run: |
          rm -rf telegram-owner-dist
          mkdir telegram-owner-dist
          cp -R tweb/dist/. telegram-owner-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-owner-dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Telegram Owner Presence test [skip ci]"
          git push origin HEAD:telegram-owner-presence-test-20260925
