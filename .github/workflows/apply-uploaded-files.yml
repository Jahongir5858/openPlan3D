name: Apply uploaded OpenPlan3D files

on:
  push:
    branches: [cloudflare-auth-d1]
    paths:
      - '.upload-patches/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: cloudflare-auth-d1

      - name: Apply uploaded file changes
        run: node .upload-patches/apply-user-files.mjs

      - name: Commit patched OpenPlan3D sources
        shell: bash
        run: |
          if git diff --quiet -- src/lib/utils/canvasRenderer.ts src/lib/components/viewer3d/ThreeViewer.svelte src/lib/components/sidebar/PropertiesPanel.svelte; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/utils/canvasRenderer.ts src/lib/components/viewer3d/ThreeViewer.svelte src/lib/components/sidebar/PropertiesPanel.svelte
          git commit -m 'Apply uploaded OpenPlan3D rendering fixes'
          git push origin HEAD:cloudflare-auth-d1
