name: Fix and validate final release

on:
  push:
    branches:
      - final-fixed-release
    paths:
      - .github/workflows/fix-and-validate-final.yml

permissions:
  contents: write

jobs:
  fix-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: final-fixed-release
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extend tool type for existing UI actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/stores/project.ts')
          s = p.read_text()
          old = "export type Tool = 'select' | 'wall' | 'door' | 'window' | 'furniture' | 'text';"
          new = "export type Tool = 'select' | 'wall' | 'door' | 'window' | 'furniture' | 'text' | 'annotate' | 'measure';"
          if old not in s and new not in s:
              raise SystemExit('Tool type declaration not found')
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type and Svelte check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/stores/project.ts
          git commit -m 'Fix tool type for annotation and measurement actions'
          git push origin HEAD:final-fixed-release
