name: Sync OpenPlan3D ZIP

on:
  push:
    branches: [zip-sync-final-20260905]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/xz00 .sync/xz01 .sync/xz02 .sync/xz03 .sync/xz04 .sync/xz05 \
              .sync/xz06 .sync/xz07 .sync/xz08 .sync/xz09 .sync/xz10 .sync/xz11 \
              .sync/xzb03 .sync/xzb04 .sync/xzb05 .sync/xzb06 .sync/xzb07 \
              .sync/xzb08 .sync/xzb09 .sync/xzb10 \
              .sync/xz11a0 .sync/xz11a1 .sync/xz11a2 .sync/xz11a3 \
              .sync/xz12b0 .sync/xz12b1 .sync/xz12b2 > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.xz
          echo "2b3904c353d15f13a6d5c3956bf184fe2c43c074e0c9d59bb04905c77787de91  /tmp/overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/overlay.tar.xz -C .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte checks
        run: npm run check

      - name: Tests with diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      - name: Build
        run: npm run build

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "Tests failed; see test-output artifact."
          exit 1

      - name: Commit synced ZIP
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/sync-openplan3d-zip.yml
          rm -f test-output.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync openPlan3D-fixed ZIP update"
          git push origin HEAD:zip-sync-final-20260905
